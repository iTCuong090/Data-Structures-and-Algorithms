<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSelect - Find the Median Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7f00ff;
            --accent-pink: #ff007f;
            --accent-gold: #ffb703;
            --accent-green: #00e676;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 230, 118, 0.12) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 183, 3, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="text"] {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            width: 240px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-gold), #fb8500);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
        }

        .btn-action:hover {
            box-shadow: 0 6px 20px rgba(255, 183, 3, 0.6);
        }

        .btn-green {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
        }

        .btn-skip {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .main-layout {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .game-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .stage-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 16px 20px;
            border-radius: 16px;
            border-left: 4px solid var(--accent-green);
        }

        .stage-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stage-step {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--accent-green);
            background: rgba(0, 230, 118, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
        }

        /* Array Track Visualizer */
        .array-track-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 20px 24px;
            align-items: center;
            position: relative;
        }

        .array-slots {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .index-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .num-card {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .num-card.dimmed {
            opacity: 0.25;
            filter: grayscale(90%);
            border-color: transparent;
        }

        .num-card.target-slot {
            border: 2px solid var(--accent-gold);
            background: rgba(255, 183, 3, 0.08);
        }

        .num-card.pivot-card {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            border-color: #ffe6a7;
            color: #000;
            box-shadow: 0 8px 24px rgba(255, 183, 3, 0.5);
            animation: pulseGlow 2s infinite;
        }

        .num-card.fixed-pivot {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            border-color: #00e676 !important;
            color: #000 !important;
            box-shadow: 0 0 18px rgba(0, 230, 118, 0.6) !important;
        }

        .num-card.scanner-card {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.5);
        }

        .num-card.small-ptr-card {
            border-color: var(--accent-blue);
        }

        .num-card.median-found {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            border-color: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.8);
            transform: scale(1.15);
        }

        .pointer-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: absolute;
            top: -28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .badge-i { background: var(--accent-blue); color: #000; }
        .badge-j { background: var(--accent-cyan); color: #000; }
        .badge-pivot { background: var(--accent-gold); color: #000; }
        .badge-fixed { background: #00e676; color: #000; }
        .badge-target { 
            background: linear-gradient(135deg, #00e676, #00b09b); 
            color: #000;
            bottom: -28px;
            top: auto;
        }

        .instruction-box {
            background: rgba(0, 230, 118, 0.05);
            border: 1px solid rgba(0, 230, 118, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .instruction-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
        }

        .highlight-num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: var(--accent-green);
        }

        .actions-grid {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Console & History Panel */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .console-card {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .console-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-green);
        }

        .terminal-window {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #00e676;
            background: #04070d;
            border-radius: 12px;
            padding: 14px;
            min-height: 180px;
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(0, 230, 118, 0.15);
        }

        .terminal-line {
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .terminal-line.median-found-log {
            color: #00e676;
            font-weight: 800;
            font-size: 14px;
        }

        .tree-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tree-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .task-item {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 3px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
        }

        .task-item.completed {
            border-left-color: var(--accent-green);
            background: rgba(0, 230, 118, 0.05);
            color: var(--text-main);
        }

        .task-item.active {
            border-left-color: var(--accent-gold);
            background: rgba(255, 183, 3, 0.08);
            color: #fff;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: #ef4444;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        .toast.success {
            background: #10b981;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 183, 3, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 183, 3, 0.8); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.4s ease;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <div class="logo-icon">MED</div>
            <div>
                <h1>QuickSelect - Find the Median Game</h1>
            </div>
        </div>
        <div class="controls">
            <input type="text" id="arrayInput" value="0, 1, 2, 4, 6, 5, 3" placeholder="e.g. 0, 1, 2, 4, 6, 5, 3">
            <button class="btn" onclick="startNewGame()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Reset Game
            </button>
        </div>
    </header>

    <div class="main-layout">
        <!-- Left: Game Area -->
        <div class="game-panel" id="gamePanel">
            
            <div class="stage-banner">
                <div>
                    <div class="stage-title">Target Median Index k = <span id="medianTargetIdxText" style="color: var(--accent-green); font-weight: 800;">3</span> (Value at Index k after QuickSelect)</div>
                    <div style="font-weight: 800; font-size: 18px; margin-top: 2px;" id="rangeLabel">Subarray Range [0 .. 6]</div>
                </div>
                <div class="stage-step" id="stepCounter">Step 1</div>
            </div>

            <!-- Array Slots Container -->
            <div class="array-track-container">
                <div class="array-slots" id="arraySlots">
                    <!-- Dynamic Slots -->
                </div>
            </div>

            <!-- Instruction Box -->
            <div class="instruction-box">
                <div class="instruction-text" id="instructionText">
                    Comparing element <span class="highlight-num" id="scannerVal">arr[j]</span> with Pivot <span class="highlight-num" id="pivotVal">3</span>...
                </div>
            </div>

            <!-- Actions Grid -->
            <div class="actions-grid" id="actionsGrid">
                <!-- Action buttons rendered dynamically -->
            </div>

        </div>

        <!-- Right: Console & History Panel -->
        <div class="side-panel">
            
            <div class="console-card">
                <div class="console-header">
                    <div class="console-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                        QuickSelect Terminal Log
                    </div>
                </div>
                <div class="terminal-window" id="terminal">
                    <div class="terminal-line">// QuickSelect Step-by-Step Log</div>
                </div>
            </div>

            <div class="tree-card">
                <div class="tree-title">📜 QuickSelect History (Past Steps)</div>
                <div class="task-list" id="historyList">
                    <!-- Past history steps -->
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        let array = [0, 1, 2, 4, 6, 5, 3];
        let targetK = 3;
        let low = 0;
        let high = 0;
        let pivot = 0;
        let iPtr = 0;
        let jPtr = 0;
        let stepCount = 1;
        let phase = 'scan';
        let historyList = [];
        let fixedPivotIndices = new Set();
        let lastPlacedPivotIndex = -1;

        function startNewGame() {
            const inputStr = document.getElementById("arrayInput").value;
            const parsed = inputStr.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));

            if (parsed.length === 0) {
                showToast("Please enter a valid array!", true);
                return;
            }

            array = [...parsed];
            targetK = Math.floor(array.length / 2);
            low = 0;
            high = array.length - 1;
            stepCount = 1;
            historyList = [];
            fixedPivotIndices.clear();
            document.getElementById("terminal").innerHTML = `<div class="terminal-line">// QuickSelect Step-by-Step Log</div>`;

            document.getElementById("medianTargetIdxText").innerText = targetK;

            startPartitionPhase();
            showToast(`Find Median Game Started! Target Index k = ${targetK}`, false);
        }

        function startPartitionPhase() {
            if (low >= high) {
                // Median found at low == high!
                phase = 'finished';
                lastPlacedPivotIndex = low;
                renderUI();
                showVictoryScreen(array[low]);
                return;
            }

            pivot = array[high];
            iPtr = low;
            jPtr = low;
            phase = 'scan';
            renderUI();
        }

        function renderUI() {
            document.getElementById("rangeLabel").innerText = `Subarray Range [${low} .. ${high}] (Pivot = ${pivot})`;
            document.getElementById("stepCounter").innerText = `Step ${stepCount}`;

            const slotsEl = document.getElementById("arraySlots");
            slotsEl.innerHTML = "";

            for (let idx = 0; idx < array.length; idx++) {
                const wrapper = document.createElement("div");
                wrapper.className = "slot-wrapper";

                const isFixed = fixedPivotIndices.has(idx);

                // Pointer Badges
                if (isFixed) {
                    wrapper.appendChild(createBadge("FIXED ✓", "badge-fixed"));
                } else if (idx === iPtr && idx === jPtr && idx === high && phase === 'scan') {
                    wrapper.appendChild(createBadge("i, j, PIVOT", "badge-pivot"));
                } else if (idx === iPtr && idx === jPtr && phase === 'scan') {
                    wrapper.appendChild(createBadge("i, j", "badge-i"));
                } else if (idx === iPtr && phase === 'scan') {
                    wrapper.appendChild(createBadge("i (small)", "badge-i"));
                } else if (idx === jPtr && phase === 'scan') {
                    wrapper.appendChild(createBadge("j (scan)", "badge-j"));
                } else if (idx === high && (phase === 'scan' || phase === 'final_swap')) {
                    wrapper.appendChild(createBadge("PIVOT", "badge-pivot"));
                }

                // Card Element
                const card = document.createElement("div");
                card.className = "num-card";
                card.innerText = array[idx];

                if (isFixed) {
                    card.classList.add("fixed-pivot");
                } else {
                    const isInRange = (idx >= low && idx <= high);
                    if (!isInRange) {
                        card.classList.add("dimmed");
                    }

                    if (idx === targetK) {
                        card.classList.add("target-slot");
                    }

                    if (phase === 'finished' && idx === targetK) {
                        card.classList.add("median-found");
                    } else if (idx === high && (phase === 'scan' || phase === 'final_swap')) {
                        card.classList.add("pivot-card");
                    } else if (idx === jPtr && phase === 'scan') {
                        card.classList.add("scanner-card");
                    } else if (idx === iPtr && phase === 'scan') {
                        card.classList.add("small-ptr-card");
                    }
                }

                if (idx === targetK) {
                    wrapper.appendChild(createBadge("🎯 TARGET k", "badge-target"));
                }

                wrapper.appendChild(card);

                // Index Label
                const idxLabel = document.createElement("div");
                idxLabel.className = "index-label";
                idxLabel.innerText = `[${idx}]`;
                wrapper.appendChild(idxLabel);

                slotsEl.appendChild(wrapper);
            }

            renderActions();
            renderHistory();
        }

        function createBadge(text, className) {
            const badge = document.createElement("div");
            badge.className = `pointer-badge ${className}`;
            badge.innerText = text;
            return badge;
        }

        function renderActions() {
            const instrEl = document.getElementById("instructionText");
            const actionsEl = document.getElementById("actionsGrid");
            actionsEl.innerHTML = "";

            if (phase === 'scan') {
                const currentScanVal = array[jPtr];
                instrEl.innerHTML = `Scan j=[${jPtr}] (Value <span class="highlight-num">${currentScanVal}</span>) vs Pivot <span class="highlight-num">${pivot}</span>. Is <span class="highlight-num">${currentScanVal} &le; ${pivot}</span>?`;

                actionsEl.innerHTML = `
                    <button class="btn btn-action" onclick="handleScanChoice(true)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
                        Yes: Swap arr[${iPtr}] & arr[${jPtr}] (i++)
                    </button>
                    <button class="btn btn-skip" onclick="handleScanChoice(false)">
                        No: Keep Position (j++)
                    </button>
                `;
            } else if (phase === 'final_swap') {
                instrEl.innerHTML = `Partition Scan Complete! Place Pivot <span class="highlight-num">${pivot}</span> into index <span class="highlight-num">${iPtr}</span>.`;

                actionsEl.innerHTML = `
                    <button class="btn btn-action" onclick="handleFinalSwap()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                        Swap Pivot into Index i (${iPtr})
                    </button>
                `;
            } else if (phase === 'select_decision') {
                instrEl.innerHTML = `Pivot <span class="highlight-num">${pivot}</span> is placed at index <span class="highlight-num">${lastPlacedPivotIndex}</span>. Target Median index is <span class="highlight-num">k=${targetK}</span>. What should QuickSelect do next?`;

                if (lastPlacedPivotIndex === targetK) {
                    actionsEl.innerHTML = `
                        <button class="btn btn-green" onclick="handleDecision('found')">
                            🎯 Index p == k (${targetK})! Found Median = ${array[targetK]}!
                        </button>
                    `;
                } else if (lastPlacedPivotIndex > targetK) {
                    actionsEl.innerHTML = `
                        <button class="btn btn-action" onclick="handleDecision('left')">
                            ⬅️ Index p (${lastPlacedPivotIndex}) &gt; k (${targetK}): Recurse Left [${low} .. ${lastPlacedPivotIndex - 1}]
                        </button>
                    `;
                } else {
                    actionsEl.innerHTML = `
                        <button class="btn btn-action" onclick="handleDecision('right')">
                            ➡️ Index p (${lastPlacedPivotIndex}) &lt; k (${targetK}): Recurse Right [${lastPlacedPivotIndex + 1} .. ${high}]
                        </button>
                    `;
                }
            }
        }

        function handleScanChoice(userChoseSwap) {
            const currentScanVal = array[jPtr];
            const shouldSwap = (currentScanVal <= pivot);

            if (userChoseSwap === shouldSwap) {
                if (shouldSwap) {
                    swap(iPtr, jPtr);
                    iPtr++;
                }
                jPtr++;

                if (jPtr === high) {
                    phase = 'final_swap';
                }

                renderUI();
            } else {
                if (shouldSwap) {
                    showToast(`Incorrect! ${currentScanVal} ≤ ${pivot}, so it SHOULD be swapped with arr[${iPtr}].`, true);
                } else {
                    showToast(`Incorrect! ${currentScanVal} > ${pivot}, so it should NOT be swapped. Just advance j.`, true);
                }
                document.getElementById("gamePanel").classList.add("shake");
                setTimeout(() => document.getElementById("gamePanel").classList.remove("shake"), 400);
            }
        }

        function handleFinalSwap() {
            swap(iPtr, high);
            lastPlacedPivotIndex = iPtr;
            fixedPivotIndices.add(lastPlacedPivotIndex);
            phase = 'select_decision';

            logTerminalLine(`Partition result: [ ${array.join(" ")} ] (Pivot ${pivot} @ index ${lastPlacedPivotIndex})`);

            historyList.push({
                step: stepCount++,
                range: `[${low}..${high}]`,
                pivot: pivot,
                pivotIdx: lastPlacedPivotIndex,
                arrayState: [...array]
            });

            renderUI();
        }

        function handleDecision(userDecision) {
            if (lastPlacedPivotIndex === targetK && userDecision === 'found') {
                phase = 'finished';
                renderUI();
                showVictoryScreen(array[targetK]);
            } else if (lastPlacedPivotIndex > targetK && userDecision === 'left') {
                high = lastPlacedPivotIndex - 1;
                logTerminalLine(`--> Recursing LEFT to range [${low} .. ${high}] (discarding right side)`);
                startPartitionPhase();
            } else if (lastPlacedPivotIndex < targetK && userDecision === 'right') {
                low = lastPlacedPivotIndex + 1;
                logTerminalLine(`--> Recursing RIGHT to range [${low} .. ${high}] (discarding left side)`);
                startPartitionPhase();
            } else {
                showToast("Incorrect QuickSelect direction! Compare pivot index p with target k.", true);
            }
        }

        function swap(idx1, idx2) {
            let temp = array[idx1];
            array[idx1] = array[idx2];
            array[idx2] = temp;
        }

        function logTerminalLine(text) {
            const term = document.getElementById("terminal");
            const line = document.createElement("div");
            line.className = "terminal-line";
            line.innerText = text;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
        }

        function renderHistory() {
            const historyEl = document.getElementById("historyList");
            historyEl.innerHTML = "";

            historyList.forEach(h => {
                const item = document.createElement("div");
                item.className = "task-item completed";
                item.innerHTML = `<span style="color: var(--accent-green); font-weight: 700;">✓ Step ${h.step}:</span> Partition ${h.range} -> Pivot=${h.pivot} at index ${h.pivotIdx}<br><span style="font-size: 11px; opacity: 0.85;">Array: ${h.arrayState.join(' ')}</span>`;
                historyEl.appendChild(item);
            });

            if (phase !== 'finished') {
                const item = document.createElement("div");
                item.className = "task-item active";
                item.innerText = `▶ Step ${stepCount}: Range [${low}..${high}] (Target k=${targetK})`;
                historyEl.appendChild(item);
            }
        }

        function showVictoryScreen(medianVal) {
            logTerminalLine(`🎉 MEDIAN FOUND = ${medianVal} at index ${targetK}!`);

            document.getElementById("gamePanel").innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <div style="font-size: 64px; margin-bottom: 8px;">🎯</div>
                    <h2 style="font-size: 32px; font-weight: 800; color: var(--accent-green); margin-bottom: 12px;">MEDIAN FOUND: ${medianVal}!</h2>
                    <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 24px;">QuickSelect found the median at index k=${targetK} in O(N) average time!</p>
                    <button class="btn btn-green" style="margin: 0 auto; padding: 14px 32px; font-size: 16px;" onclick="location.reload()">Play Again</button>
                </div>
            `;
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });
        }

        function showToast(msg, isError) {
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");
            
            toastMsg.innerText = msg;
            toast.className = `toast show ${isError ? 'error' : 'success'}`;

            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        window.onload = () => {
            startNewGame();
        };
    </script>
</body>
</html>
